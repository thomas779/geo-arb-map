name: Weekly web discovery

# Broad web discovery via Exa + Tavily + Firecrawl. Complements daily monitor.yml
# (RSS + Gemini sweep). Discovery only — never ships data or Telegram.
#
# Free-tier defaults (per weekly run, 7 regions) — see monitor/prompts/web-discover-efficiency.md:
#   Exa deep-lite × 7, Tavily basic × 7 (~7 credits), Firecrawl web-search × 7 (~14 credits)
#   plus one allowlisted Tavily pass per region over that region's official
#   publishers (~7 more credits; skipped for a region the manifest has no source
#   for). It is ADDITIVE: an allowlist can only return hosts we already watch, so
#   it answers "what did the gazettes publish" while the open query above keeps
#   asking "what changed anywhere".
#   No Firecrawl scrape, no Tavily raw_content, social domains excluded on all
#   three providers (Exa had no domain filter at all until the gazette pass landed).
# Cap further with workflow_dispatch inputs if a month is running hot.

on:
  schedule:
    # Monday 07:17 UTC — offset from the daily monitor cron (06:17).
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      open_issue:
        description: Open umbrella issue (+ filtered Exa lead issues unless disabled)
        required: false
        default: true
        type: boolean
      open_lead_issues:
        description: Also open separate monitor-lead issues for Exa medium/high actionable rows
        required: false
        default: true
        type: boolean
      providers:
        description: "Comma-separated providers (exa,tavily,firecrawl)"
        required: false
        default: "exa,tavily,firecrawl"
        type: string
      regions:
        description: "Optional comma-separated region packs (europe,gulf,caribbean,latam,africa,asia,anglosphere_north)"
        required: false
        type: string
      search_type:
        description: Exa search type for this run (deep-lite is cheapest structured mode)
        required: false
        default: deep-lite
        type: choice
        options: [deep-lite, deep, deep-reasoning]
      lookback_days:
        description: Published-date lookback window in days
        required: false
        default: "7"
        type: string
      max_results:
        description: Max Tavily/Firecrawl results per region (keep low on free tiers)
        required: false
        default: "3"
        type: string
      max_issues:
        description: Hard cap on per-lead monitor-lead issues filed by this run
        required: false
        default: "10"
        type: string
      gazette_pass:
        description: Extra allowlisted Tavily pass per region over official publishers (~1 credit/region)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-web-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # The provider calls are serial: 7 regions x (Exa 180s + Tavily 60s +
    # Firecrawl 90s) is ~39 minutes of API waiting in the worst case, all of it
    # inside GitHub's 6-hour default. A hung provider would have burned six
    # hours of runner time before anyone saw it. 60 leaves headroom for install
    # and the dataset fetch without hiding a real hang.
    timeout-minutes: 60
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      EXA_SEARCH_TYPE: ${{ inputs.search_type || vars.EXA_SEARCH_TYPE || 'deep-lite' }}
      WEB_DISCOVER_LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.WEB_DISCOVER_LOOKBACK_DAYS || '7' }}
      WEB_DISCOVER_MAX_RESULTS: ${{ inputs.max_results || vars.WEB_DISCOVER_MAX_RESULTS || '3' }}
      WEB_DISCOVER_PROVIDERS: ${{ inputs.providers || vars.WEB_DISCOVER_PROVIDERS || 'exa,tavily,firecrawl' }}
      WEB_DISCOVER_MAX_ISSUES: ${{ inputs.max_issues || vars.WEB_DISCOVER_MAX_ISSUES || '10' }}
      EXA_TIMEOUT_MS: ${{ vars.EXA_TIMEOUT_MS || '180000' }}
      TAVILY_TIMEOUT_MS: ${{ vars.TAVILY_TIMEOUT_MS || '60000' }}
      FIRECRAWL_TIMEOUT_MS: ${{ vars.FIRECRAWL_TIMEOUT_MS || '90000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch compiled dataset
        uses: ./.github/actions/fetch-data
        with:
          deploy-key: ${{ secrets.FLAG_PATHS_DATA_DEPLOY_KEY }}

      # Same step as monitor.yml: `--state all` matters, because a lead that was
      # filed and CLOSED is still a lead we have seen, and refiling it weekly is
      # exactly what the fingerprint exists to stop.
      - name: Read existing issue markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .out
          gh issue list --state all --limit 1000 --json number,body > .out/existing-issues.json

      - name: Require at least one provider key
        run: |
          set -euo pipefail
          ok=0
          echo "$WEB_DISCOVER_PROVIDERS" | tr ',' '\n' | while read -r p; do
            p=$(echo "$p" | tr -d '[:space:]')
            [ -z "$p" ] && continue
            case "$p" in
              exa)
                if [ -z "${EXA_API_KEY:-}" ]; then echo "::warning::EXA_API_KEY missing"; else ok=1; fi
                ;;
              tavily)
                if [ -z "${TAVILY_API_KEY:-}" ]; then echo "::warning::TAVILY_API_KEY missing"; else ok=1; fi
                ;;
              firecrawl)
                if [ -z "${FIRECRAWL_API_KEY:-}" ]; then echo "::warning::FIRECRAWL_API_KEY missing"; else ok=1; fi
                ;;
            esac
          done
          # Bash while-in-pipe subshell cannot set ok; re-check explicitly:
          has=0
          echo "$WEB_DISCOVER_PROVIDERS" | grep -q 'exa' && [ -n "${EXA_API_KEY:-}" ] && has=1
          echo "$WEB_DISCOVER_PROVIDERS" | grep -q 'tavily' && [ -n "${TAVILY_API_KEY:-}" ] && has=1
          echo "$WEB_DISCOVER_PROVIDERS" | grep -q 'firecrawl' && [ -n "${FIRECRAWL_API_KEY:-}" ] && has=1
          if [ "$has" -ne 1 ]; then
            echo "::error::No usable provider API keys for selected providers ($WEB_DISCOVER_PROVIDERS)"
            exit 1
          fi

      - name: Run multi-provider discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .out
          ARGS=(--providers "$WEB_DISCOVER_PROVIDERS")
          if [ -n "${{ inputs.regions }}" ]; then
            ARGS+=(--regions "${{ inputs.regions }}")
          fi
          # On for the scheduled run, and for a manual run unless switched off.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.gazette_pass }}" != "false" ]; then
            ARGS+=(--gazette-pass)
          else
            ARGS+=(--no-gazette-pass)
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.open_issue }}" = "true" ]; then
            ARGS+=(--open-issue)
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.open_lead_issues }}" = "true" ]; then
              ARGS+=(--open-leads)
            else
              ARGS+=(--no-open-leads)
            fi
          fi
          bun run monitor:web-discover -- "${ARGS[@]}"

      - name: Summary
        if: always()
        run: |
          if [ -f .out/web-leads.md ]; then
            cat .out/web-leads.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f .out/exa-leads.md ]; then
            cat .out/exa-leads.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary file produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-web-leads
          path: |
            .out/web-leads.json
            .out/web-leads.md
            .out/exa-leads.json
            .out/exa-leads.md
          if-no-files-found: warn
