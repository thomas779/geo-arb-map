name: Deploy web

# Replaces the Cloudflare Workers Builds git integration, for two reasons: the
# compiled corpus now lives in a private repo that a Cloudflare-side build cannot
# authenticate to without a dashboard-managed secret, and a deploy that runs here
# is gated on the test suite by construction, because `bun run build` is
# `bun run verify && vite build` — tsc plus the full suite, then the bundle.
#
# Deploys with CLOUDFLARE_API_TOKEN, whose Cloudflare token (flag-paths-gh-actions)
# gained Workers Scripts: Edit on 2026-08-04. Deliberate tradeoff, recorded so it is
# not mistaken for an oversight: that same token is used by the monitor workflows,
# which run LLM-driven code against untrusted pages, so deploy rights now sit inside
# that blast radius. Accepted for simplicity over a second token; revisit by giving
# the deploy its own token if the monitor's surface grows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # Non-secret account identifier, set explicitly for the same reason
      # backup-d1.yml does: without it wrangler falls back to listing accounts,
      # which needs a permission the deploy token does not otherwise require and
      # which silently broke that workflow on 2026-07-23.
      CLOUDFLARE_ACCOUNT_ID: 9fa27a0cad6d1317e96592c85e31f7a6
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch compiled dataset
        uses: ./.github/actions/fetch-data
        with:
          deploy-key: ${{ secrets.FLAG_PATHS_DATA_DEPLOY_KEY }}

      - name: Verify and build
        run: bun run build

      # Guards the point of the slicing work: the corpus must never ship as a
      # served file again, whatever a future change to public/ does.
      - name: Assert the bulk corpus is not served
        run: |
          set -euo pipefail
          for path in dist/citizenship_routes.json dist/edges.json; do
            if [ -f "$path" ]; then
              echo "::error::$path would be served; the corpus is a build input, not a public endpoint"
              exit 1
            fi
          done
          test -f dist/atlas-index.json
          slices=$(ls dist/country/*/data.json | wc -l)
          echo "served surface: atlas-index.json + $slices country slices"

      - name: Deploy
        if: env.HAS_DEPLOY_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy -c wrangler.web.jsonc

      - name: Explain a skipped deploy
        if: env.HAS_DEPLOY_TOKEN != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the build was verified but not deployed."
          echo "The token needs Workers Scripts: Edit to deploy this Worker."
