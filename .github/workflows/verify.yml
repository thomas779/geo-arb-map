name: Verify repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The corpus is not in this repo (see .github/actions/fetch-data). Tests and
      # the prerender read it as a build input, so it must land before either runs.
      - name: Fetch compiled dataset
        uses: ./.github/actions/fetch-data
        with:
          deploy-key: ${{ secrets.FLAG_PATHS_DATA_DEPLOY_KEY }}

      - name: Type-check, test committed artifacts, and build
        run: bun run build
