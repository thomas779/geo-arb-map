name: Publish reviewed Telegram brief

# Two triggers, same job. The dispatch stays for manual reruns; the label is the
# one that stops Telegram silently falling behind the dataset. Before this, a
# reviewer had to remember to come back and dispatch with the right issue number,
# and twice they did not: the Gibraltar and Syria briefs sat unpublished with the
# reviewer template still empty while the data was already live.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Reviewed monitoring issue number
        required: true
        type: number
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: telegram-publish
  cancel-in-progress: false

jobs:
  publish:
    # Only the approval label, never any other labelling activity.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'publish-approved'
    runs-on: ubuntu-latest
    # Keeps the human gate: the environment's reviewers still approve the run.
    # What is removed is having to remember to start it, not the check on it.
    environment: telegram-publication
    env:
      GH_TOKEN: ${{ github.token }}
      MONITOR_LLM_PROVIDER: ${{ vars.MONITOR_LLM_PROVIDER }}
      MONITOR_LLM_BASE_URL: ${{ vars.MONITOR_LLM_BASE_URL }}
      MONITOR_LLM_MODEL: ${{ vars.MONITOR_LLM_MODEL }}
      MONITOR_LLM_TIMEOUT_MS: ${{ vars.MONITOR_LLM_TIMEOUT_MS }}
      MONITOR_LLM_API_KEY: ${{ secrets.MONITOR_LLM_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MONITOR_TRIAGE_MODEL: ${{ vars.MONITOR_TRIAGE_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The compiled corpus is gitignored and lives in the private flag-paths-data
      # repo as of 2026-08-04, so anything reading it has to fetch it first.
      - name: Fetch compiled dataset
        uses: ./.github/actions/fetch-data
        with:
          deploy-key: ${{ secrets.FLAG_PATHS_DATA_DEPLOY_KEY }}

      - name: Resolve the issue number
        env:
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          LABELED_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          number="${DISPATCH_ISSUE:-$LABELED_ISSUE}"
          if [ -z "$number" ]; then
            echo "::error::Could not resolve an issue number from this trigger"
            exit 1
          fi
          echo "ISSUE_NUMBER=$number" >> "$GITHUB_ENV"
          echo "publishing brief from issue #$number"

      - name: Preview reviewed brief
        run: bun run monitor:telegram -- --issue "$ISSUE_NUMBER" --dry-run

      - name: Publish reviewed brief
        run: bun run monitor:telegram -- --issue "$ISSUE_NUMBER" --apply
