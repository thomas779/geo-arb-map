name: X watchlist seed

# Reverse-discovery seed for the X watchlist. Asks Grok (x_search) for X accounts
# — any follower count — that regularly post real mobility-law changes, each
# backed by a real post URL. MANUAL only (no cron): one Grok call per run, so it
# never spends on its own. Output is a review artifact; a human adds approved
# handles to monitor/sources/x-watchlist.json.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "directory (accounts that post regularly) | reverse (from our published changes) | both"
        required: false
        default: "directory"
        type: choice
        options: [directory, reverse, both]
      model:
        description: "xAI model for this seed run (seeding is occasional, so a stronger model is worth it)"
        required: false
        default: "grok-4.5"
        type: string

permissions:
  contents: read

concurrency:
  group: x-watchlist-seed
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      MONITOR_XAI_API_KEY: ${{ secrets.MONITOR_XAI_API_KEY }}
      MONITOR_XAI_MODEL: ${{ inputs.model || 'grok-4.5' }}
      MONITOR_XAI_TIMEOUT_MS: ${{ vars.MONITOR_XAI_TIMEOUT_MS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # reverse/both mode reads our published changes from the monitor_posts ledger.
      - name: Export published-change ledger
        if: inputs.mode != 'directory'
        run: |
          mkdir -p .out
          bunx wrangler d1 export flag-paths-data \
            --remote --config data/d1/wrangler.jsonc \
            --output .out/state.sql --skip-confirmation

      - name: Generate candidate accounts
        run: |
          ARGS="--mode ${{ inputs.mode }}"
          [ "${{ inputs.mode }}" != "directory" ] && ARGS="$ARGS --state-db .out/state.sql"
          bun run monitor:sources:x-seed -- $ARGS

      - name: Report
        if: always()
        run: cat .generated/monitor/x-watchlist-candidates.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no candidates file"

      - name: Upload candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-watchlist-candidates
          path: .generated/monitor/x-watchlist-candidates.*
          if-no-files-found: warn
